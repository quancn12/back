# GPU overlay for docker-compose.production.yml.
#
# Use this only on a host that has an NVIDIA GPU and the NVIDIA Container
# Toolkit installed. Without the toolkit the stack fails to start, which is why
# GPU access is an explicit opt-in rather than part of the base file.
#
#   docker compose --env-file .env.production \
#     -f docker-compose.production.yml -f docker-compose.gpu.yml up -d --build
#
# Check the toolkit first:
#   docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# A GPU released after the installed driver may not be supported. Confirm that
# `nvidia-smi` reports the card and that the Ollama logs say the model runs on
# GPU rather than falling back to CPU.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
